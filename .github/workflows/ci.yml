name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Run JS actions (checkout, setup-python) on Node 24 — Node 20 is deprecated
  # (forced default June 2026, removed from runners Sept 2026). Version-agnostic;
  # no action-major bumps to track. Matches the steam game repos.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile proxy.py
      - name: Unit tests (network-free)
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
